# Environment
app.env=${ENV}
spring.profile.active=${ENV}

# Server Configuration
server.port=8080

# PostgreSQL Database Configuration
spring.datasource.url=jdbc:postgresql://${DB_HOST:localhost}:${DB_PORT:5432}/${DB_NAME:grondona}
spring.datasource.username=${DB_USER:grondona}
spring.datasource.password=${DB_PASSWORD:grondona}
spring.datasource.driver-class-name=org.postgresql.Driver

# JPA/Hibernate Configuration
spring.jpa.hibernate.ddl-auto=validate
spring.jpa.show-sql=false
spring.jpa.properties.hibernate.dialect=org.hibernate.dialect.PostgreSQLDialect
spring.jpa.properties.hibernate.format_sql=true

# Serialization
spring.jackson.property-naming-strategy=SNAKE_CASE
spring.jackson.default-property-inclusion=non_empty

# JWT Configuration
jwt.secret=${JWT_SECRET:1b01ec022f04b74f469c22f93a937a61b020c0945cb981df5f2fc1f7d59d4cba}
jwt.expiration=${JWT_EXPIRATION:86400000}

# Error logging
logging.level.com.grondona=DEBUG
logging.level.org.springframework=ERROR
logging.level.org.hibernate=ERROR
logging.level.org.apache.catalina=ERROR
logging.level.org.springframework.web.servlet.DispatcherServlet=OFF
logging.level.org.hibernate.SQL=OFF
logging.level.org.hibernate.type.descriptor.sql=OFF
logging.level.org.hibernate.orm.jdbc.bind=OFF

# Matches API
external.api.matches.with-new-matches=${NEW_MATCHES:false}
external.api.matches.with-updated-quotas=${UPDATED_QUOTAS:false}
external.api.matches.poll-interval-ms=${MATCHES_API_POLL_INTERVAL:10000}
external.api.matches.timeout-ms=${MATCHES_API_TIMEOUT:3000}
external.api.matches.base-url=${MATCHES_API_URL}
external.api.matches.key=${MATCHES_API_KEY}

# Mail (SMTP used in prod profile only)
spring.mail.host=${MAIL_HOST:}
spring.mail.port=${MAIL_PORT:587}
spring.mail.username=${MAIL_USERNAME:donprode.argentino@gmail.com}
spring.mail.password=${MAIL_PASSWORD:lacontrasenia}
spring.mail.properties.mail.smtp.auth=${MAIL_SMTP_AUTH:true}
spring.mail.properties.mail.smtp.starttls.enable=${MAIL_SMTP_STARTTLS:true}
