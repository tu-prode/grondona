        is_private:
          type: boolean
          description: Whether the group is private (defaults to false)
          default: false
          example: false
        max_members:
          type: integer
          format: int16
          description: Maximum number of members allowed
          minimum: 1
          example: 20

    UpdateGroupRequest:
      type: object
      description: All fields are optional. Only provided fields will be updated.
      properties:
