        group_name:
          type: string
          description: Group name
          example: General
        tournament_id:
          type: string
          format: uuid
          description: Unique tournament identifier
          example: c0773be5-a5aa-4b88-9a3d-3143fae8d48f
        tournament_name:
          type: string
          description: Group name
          example: Copa del Mundo 2026
        member_count:
          type: integer
          format: int16
          description: Current number of members in the group
          example: 12
        points:
          type: number
          format: float16
          description: Amount of points scored in the group
          example: 43.7
        rank:
          type: integer
          format: int16
          description: Rank in the group
          example: 3
        role:
          type: string
          description: Role in the group
          example: MEMBER

    CreateGroupRequest:
      type: object
