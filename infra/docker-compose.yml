version: '3.8'

services:
  db:
    image: postgres:15-alpine
    container_name: grondona-postgres
    environment:
      POSTGRES_DB: "grondona"
      POSTGRES_USER: "grondona"
      POSTGRES_PASSWORD: "grondona"
    ports:
      - "5432:5432"
    volumes:
      - grondona-data:/var/lib/postgresql/data
      - ./initdb:/docker-entrypoint-initdb.d:ro
    healthcheck:
      test: [ "CMD-SHELL", "pg_isready -U grondona -d grondona" ]
      interval: 10s
      timeout: 5s
      retries: 5
    networks:
      - prode-network

  app:
    build:
      context: ..
      dockerfile: infra/Dockerfile
    container_name: grondona-app
    env_file:
      - .env
    environment:
      # System configuration
      ENV: "local"
      NEW_MATCHES: "true"
      UPDATED_QUOTAS: "true"
      # Scheduling: in-process locally; on request-based Cloud Run set false and use Cloud Scheduler
      IN_PROCESS_SCHEDULER: "false"
      # DB configuration
      DB_HOST: "db"
      DB_PORT: 5432
      DB_NAME: "grondona"
      DB_USER: "grondona"
      # JWT configuration
      JWT_EXPIRATION: 86400000
      # Matches API configuration
      MATCHES_API_URL: "http://mocknaldo:8085"
      ODDS_API_URL: "http://mocknaldo:8085"
      # Mailing configuration
      MAIL_HOST: "smtp.sendgrid.net"
      MAIL_PORT: "587"
    ports:
      - "8080:8080"
    depends_on:
      db:
        condition: service_healthy
    networks:
      - prode-network

  mocknaldo:
    build:
      context: ..
      dockerfile: infra/mocknaldo/Dockerfile
    container_name: grondona-mocknaldo
    environment:
      EXECUTION: "fixed"
    ports:
      - "8085:8085"
    networks:
      - prode-network

volumes:
  grondona-data:

networks:
  prode-network:
    name: prode-network
    driver: bridge
