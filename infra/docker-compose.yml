version: '3.8'

services:
  db:
    image: postgres:15-alpine
    container_name: grondona-postgres
    environment:
      POSTGRES_DB: grondona
      POSTGRES_USER: grondona
      POSTGRES_PASSWORD: grondona
    ports:
      - "5432:5432"
    volumes:
      - grondona_data:/var/lib/postgresql/data
      - ./init.sql:/docker-entrypoint-initdb.d/init.sql:ro
    healthcheck:
      test: [ "CMD-SHELL", "pg_isready -U grondona -d grondona" ]
      interval: 10s
      timeout: 5s
      retries: 5
    networks:
      - prode-network

  app:
    build:
      context: ..
      dockerfile: infra/Dockerfile
    container_name: grondona-app
    environment:
      DB_HOST: db
      DB_PORT: 5432
      DB_NAME: grondona
      DB_USER: grondona
      DB_PASSWORD: grondona
      JWT_SECRET: mySecretKeyForJwtTokenGenerationThatIsAtLeast256BitsLong!
      JWT_EXPIRATION: 86400000
    ports:
      - "8080:8080"
    depends_on:
      db:
        condition: service_healthy
    networks:
      - prode-network

volumes:
  grondona_data:
    name: grondona_data

networks:
  prode-network:
    name: prode-network
    driver: bridge
