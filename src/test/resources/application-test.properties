# Environment variables
ENV=test
NEW_MATCHES=false
UPDATED_QUOTAS=false
MATCHES_API_URL=http://localhost:8080
MATCHES_API_KEY=test-key
ODDS_API_URL==http://localhost:8080
ODDS_API_KEY=test-key

# H2 In-Memory Database for Tests
spring.datasource.url=jdbc:h2:mem:testdb;DB_CLOSE_DELAY=-1;DB_CLOSE_ON_EXIT=FALSE;NON_KEYWORDS=GROUPS,GROUP
spring.datasource.driver-class-name=org.h2.Driver
spring.datasource.username=sa
spring.datasource.password=

# JPA Configuration
spring.jpa.hibernate.ddl-auto=create-drop
spring.jpa.show-sql=false
spring.jpa.properties.hibernate.dialect=org.hibernate.dialect.H2Dialect

# JWT Configuration
jwt.secret=testSecretKeyForJwtTokenGenerationThatIsAtLeast256BitsLongForTesting!
jwt.expiration=86400000

# Internal jobs (Cloud Scheduler triggers). Shared secret sent in the X-Internal-Token header.
internal.jobs.token=${INTERNAL_JOBS_TOKEN:internal-token}
